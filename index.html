<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Validation</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="logo">
        <h2>Safety Unlimited Inc.</h2>
    </div>
</header>

<div class="container">

    <h1>Certificate Validation</h1>

    <p>
        Need to verify a certificate?<br>
        Enter the certificate code below.
    </p>

    <label>Certificate Code</label>

    <input
        type="text"
        id="certificate"
        placeholder="Enter Certificate Code">

    <button id="verifyBtn">
        Verify Certificate
    </button>

</div>

<script src="js/script.js"></script>

</body>
</html>
